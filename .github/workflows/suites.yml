# Run the suite, the typesetting, and lint on every pull request.
#
# TRIGGERS. Pull requests, and pushes to `main`. Not every push to every branch:
# `pull_request` already fires on each push to a PR head, so the wider trigger
# would only double the runs.
#
# THE SUITE IS TWO JOBS, and the seam is an optional install. The typesetter
# needs Pango through PyGObject, a group a default `uv sync` does not install, so
# the default leg leaves `tests/raster` out and a job of its own installs the
# group and runs it. `tests/test_ci_scope.py` holds both halves: the leg ignores
# exactly the directories that cannot import, and every one of them is run by
# another job.
#
# LINT IS ITS OWN JOB, because a lint failure and a test failure want different
# fixes, and folding them together reports a formatting nit as a broken suite.

name: Suites

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: suites-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: "The suite"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run the suite
        # `--ignore=tests/raster` because that directory `importorskip`s the
        # `raster` group, a default
        # `uv sync` does not install it, and the resulting collection skip is
        # read by the guard below as a provisioning failure. The typesetting it
        # holds is not skipped in CI — it has its own job, immediately below,
        # which installs the group and asserts the tests really ran.
        # `tests/test_ci_scope.py` derives this list rather than trusting it, in
        # both directions.
        #
        # Nothing here reaches a television. The set is behind an abstract base
        # and the suite drives a double, which is why this leg can run on a
        # GitHub runner at all.
        run: uv run pytest tests --ignore=tests/raster -v --junitxml=results.xml
      - name: Fail if nothing actually ran
        if: always()
        run: python3 .github/scripts/assert_tests_ran.py results.xml

  typesetting:
    name: "The typesetting"
    # ITS OWN JOB BECAUSE IT NEEDS A TEXT STACK THE OTHER LEGS DO NOT. The label
    # is typeset with Pango through PyGObject, which is an optional group: a
    # device with a television and no e-paper panel installs neither, and the
    # laptop this product is developed on builds it only against Homebrew's
    # libraries. Folding
    # these into the display leg would mean either installing the group for every
    # run or never running them, and the second is what "the accessibility surface
    # is untested" looks like from the outside.
    #
    # Nothing here touches a panel — `omni_epd` is the *other* optional group and
    # installs on a Raspberry Pi and nowhere else. This job renders into a memory
    # buffer and reads the bytes back, which is why it can run on a GitHub runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the text stack the typesetter builds and renders against
        # Two unrelated needs, and missing either one fails in a way that blames
        # this code for the machine it ran on.
        #
        # **The build half.** PyPI carries no PyGObject wheel at all, and only
        # Windows wheels for pycairo — `uv.lock` is the record — so on
        # this runner both compile from source and want cairo's and
        # girepository's headers. The Pi measurement recorded in
        # `platform-and-dependency-findings.md` saw PyGObject arrive prebuilt and
        # needed no headers; that was aarch64 and it does not transfer here,
        # which is precisely how this job failed the first time it ever ran.
        #
        # **The render half.** Pango picks a face per glyph through fontconfig,
        # and a runner with no font installed resolves every one of them to
        # nothing — which does not fail, it renders blank. That would pass the
        # shape assertions and fail the ink ones.
        #
        # The girepository dev package was renamed when PyGObject moved to
        # girepository-2.0, and the runner image decides which name exists. It is
        # probed rather than guessed: a wrong literal here is a red job that says
        # nothing about the typesetter, which is the failure this whole job
        # exists to avoid.
        run: |
          sudo apt-get update
          girepository=libgirepository-2.0-dev
          apt-cache show "$girepository" > /dev/null 2>&1 || girepository=libgirepository1.0-dev
          echo "girepository dev package: $girepository"
          sudo apt-get install -y --no-install-recommends \
            "$girepository" \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            fonts-dejavu-core
      - name: Run the typesetting tests
        run: uv run --group raster pytest tests/raster -v --junitxml=results.xml
      - name: Fail if nothing actually ran
        # The guard matters more here than on any other leg. These tests skip
        # themselves when the group is absent, so a mis-provisioned job reports a
        # green run that executed no line of the typesetter.
        if: always()
        run: python3 .github/scripts/assert_tests_ran.py results.xml

  lint:
    name: "Lint and format"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: ruff and black
        run: |
          uv run ruff check .
          uv run black --check .
