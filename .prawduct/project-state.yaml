  artifacts: []

# =============================================================================
# BUILD STATE
# =============================================================================
# Runtime tracking during building. Updated after each chunk.

build_state:
  source_root: "src/"

# =============================================================================
# OPTIONAL KEYS
# =============================================================================
# Each key below is optional. Its full explanation (what reads it, what it
# trades, its exact syntax) is the plugin's docs/project-state-keys.md —
# `/prawduct:methodology project-state` — read it before setting one.

# DEPRECATED: a plan claims its branch in its own `branch:` frontmatter
# (`prawduct-hook plan bind`); this is read only while no plan does.
# active_build_plan: artifacts/build-plan-my-scope.md

# The branch feature work integrates onto. Set it on a gitflow repo.
# base_branch: develop

# A second root for build-plan file refs (plans written from inside a subdir).
# build_plan_ref_root: plugin

# The paths where a missed defect costs most; a diff touching one gets the
# deeper review. A declared list REPLACES the defaults rather than adding.
# risk_surfaces:
#   - src/auth/

# Which of your files carry the release version, read by check-released.
# release_version_files:
#   - path: VERSION
#     format: bare

# consumer_digest:
#   path: CHANGELOG.md

# Require every judgeable changed file to be referenced by test evidence.
coverage_required: false

# The exact suite invocation, when it isn't `python -m pytest` over tests/.
# test_command: uv run pytest --junit-xml={junit_xml} -q
# test_commands:    (several environments; instead of test_command)
#   - npm run test:ci -- --junit --outputFile={junit_xml}
# tests_dirs: tests
# Paths your tests read as data:
# suite_coupled_prefixes:
#   - documentation/

# Learnings budgets: every rule is one line; core.md is capped and only the
# owner raises it.
# learnings_budgets:
#   critic.md: {kb: 20, reason: "why this area needs more"}

# Block `/prawduct:pr create` while operator-verification entries are pending.
operator_verification_required: false

# The most full review rounds one build-plan scope may buy; null disables it.
review_round_budget: 6

# Advisory size thresholds:
# oversized_file_threshold_kb: 40
# evidence_store_threshold_mb: 50

# The API versioning decision that resolves the api-versioning advisory.
# api_versioning_decided:

# Backlog resolution facts, written by /prawduct:backlog.
# backlog_format_version:
# backlog_backend:
# backlog_archive_scope:
# backlog_prefixes: []
# backlog_external_imports: []
# backlog_last_groomed_at:

# =============================================================================
# CHANGE LOG
# =============================================================================
# One fragment per change in .prawduct/changes/; shipped ones move to change-log-archive/.
# Fragment format: templates/change-fragment.md in the prawduct plugin.

# Distribution mode — set by /prawduct:migrate (v2.0.0 plugin cutover).
# `plugin` tells the legacy file-sync hook to stand down (Chunk 8).
distribution: plugin

# GitHub Issues backlog backend — recorded at onboard (init-product
# --backlog-repo), the recommended path for a new product. A product that
# starts on markdown sets this later, at the scrub/cutover.
# `/prawduct:backlog` routes on this scalar.
backlog_service_repo: brookstalley/arrt-player

# `--group raster` because the typesetter is the Player's most important
# accessibility surface and the group is what makes it runnable. Without it
# `tests/raster` skips itself and the recorded evidence covers every tier of the
# label except the one that puts ink on the panel. CI's separate `typesetting`
# job holds the same claim on a runner.
test_command: uv run --group raster pytest --junit-xml={junit_xml} -q

tests_dirs: tests

# Gitflow, as Arrt runs it: features PR into develop, and develop releases to
# main. The remote's default is main, so the resolver cannot infer this.
base_branch: develop
